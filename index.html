<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Navagraha Devotion</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Fallbacks for older TV browsers */
    body {
      background-color: #120000; /* Solid dark maroon fallback */
      background: radial-gradient(circle at center, #4A0000 0%, #120000 100%);
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 2vw;
    }

    /* Outer Centered Wrapper */
    .app-viewport {
      width: 100%;
      max-width: 1600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5vh;
    }

    /* Banner for Day of Week */
    .banner {
      background-color: #FF9933; /* Solid Saffron fallback */
      background: linear-gradient(90deg, transparent, #FF9933, transparent);
      color: #000000;
      width: 100%;
      padding: 1.2vh 0;
      font-size: 24px;
      font-size: 2.4vw;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    /* Standard Card Container */
    .mantra-container {
      background-color: #1C0505; /* Solid dark fallback for transparent bg */
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid #FFD700;
      border-radius: 16px;
      padding: 3vh 3vw;
      width: 100%;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5vh;
    }

    /* Section Title */
    .section-title {
      font-size: 22px;
      font-size: 1.8vw;
      color: #FFD700;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 800;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
      text-align: center;
    }

    /* Mantra Text */
    .mantra-text {
      font-size: 28px;
      font-size: 2.2vw;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.45;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
      white-space: pre-line;
      text-align: center;
      width: 100%;
    }

    /* 7-Day Grid Layout */
    .week-grid {
      display: flex; /* Fallback for older engines without CSS Grid */
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1vw;
      width: 100%;
      padding-top: 1.5vh;
      border-top: 2px dashed #FF9933;
    }

    .day-card {
      background-color: #1A0000;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 8px;
      padding: 1.5vh 0.5vw;
      text-align: center;
      flex: 1; /* Supports flexbox fallback */
    }

    .day-card.active {
      background-color: #FF9933;
      background: linear-gradient(135deg, #FF9933, #E67E22);
      color: #000000;
      border: 2px solid #FFD700;
      box-shadow: 0 0 15px rgba(255, 153, 51, 0.6);
    }

    .day-name {
      font-size: 14px;
      font-size: 1.1vw;
      font-weight: 800;
      text-transform: uppercase;
    }

    .day-deity {
      font-size: 15px;
      font-size: 1.2vw;
      font-weight: 600;
      margin-top: 4px;
    }

    /* Hidden video style */
    .hidden-video {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Hidden Keep-Awake Video to prevent Fire TV screensaver -->
  <video id="keep-awake-video" class="hidden-video" autoplay loop muted playsinline>
    <source src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28ybXA0MQAAAAhmcmVlAAAAAG1kYXQAAAA=" type="video/mp4">
  </video>

  <div class="app-viewport">
    <!-- Top Banner -->
    <div class="banner" id="today-banner">TODAY IS ...</div>

    <!-- Dhyana Shlokam Block -->
    <div class="mantra-container">
      <div class="section-title">Dhyana Shlokam</div>
      <p class="mantra-text">Ādityāya cha sōmāya maṅgaḻāya budhāya cha |
Guru śukra śanibhyaścha rāhavē kētavē namaḥ ||</p>
    </div>

    <!-- Today's Graham Block -->
    <div class="mantra-container">
      <div class="section-title" id="graham-title">Today's Graham - ...</div>
      <p class="mantra-text" id="graham-mantra">...</p>
    </div>

    <!-- 7-Day Schedule Grid -->
    <section class="week-grid" id="week-grid"></section>
  </div>

  <script>
    var schedule = [
      { day: "Sunday", deity: "Surya", mantra: "japākusuma saṅkāśaṃ kāśyapēyaṃ mahādyutim । \ntamōriṃ sarva pāpaghnaṃ praṇatōsmi divākaram ॥" },
      { day: "Monday", deity: "Chandra", mantra: "dadhiśaṅkha tuṣārābhaṃ kṣīrārṇava samudbhavam (kṣīrōdārṇava sambhavam) । \nnamāmi śaśinaṃ sōmaṃ śambhō-rmakuṭa bhūṣaṇam ॥" },
      { day: "Tuesday", deity: "Kujah / Mangala", mantra: "dharaṇī garbha sambhūtaṃ vidyutkānti samaprabham । \n kumāraṃ śaktihastaṃ taṃ kujaṃ [maṅgaḻaṃ] praṇamāmyaham ॥" },
      { day: "Wednesday", deity: "Budha", mantra: "priyaṅgu kalikāśyāmaṃ rūpēṇā pratimaṃ budham । \nsaumyaṃ saumya (satva) guṇōpētaṃ taṃ budhaṃ praṇamāmyaham ॥" },
      { day: "Thursday", deity: "Guru / Brihaspati", mantra: "dēvānāṃ cha ṛṣīṇāṃ cha guruṃ kāñchanasannibham । \nbuddhimantaṃ trilōkēśaṃ taṃ namāmi bṛhaspatim ॥" },
      { day: "Friday", deity: "Shukra", mantra: "himakunda mṛṇāḻābhaṃ daityānaṃ paramaṃ gurum । \nsarvaśāstra pravaktāraṃ bhārgavaṃ praṇamāmyaham ॥" },
      { day: "Saturday", deity: "Shani", mantra: "nīlāñjana samābhāsaṃ raviputraṃ yamāgrajam । \nChāyā mārtāṇḍa sambhūtaṃ taṃ namāmi śanaiścharam ॥" }
    ];

    // Determine current day (0 = Sunday, 1 = Monday, etc.)
    var todayIndex = new Date().getDay();
    var todayData = schedule[todayIndex];

    // Populate Top Banner
    document.getElementById("today-banner").innerText = "TODAY IS " + todayData.day.toUpperCase();

    // Populate Dynamic Graham Block
    document.getElementById("graham-title").innerText = "Today's Graham - " + todayData.deity;
    document.getElementById("graham-mantra").innerText = todayData.mantra;

    // Populate 7-Day Grid
    var gridEl = document.getElementById("week-grid");
    for (var i = 0; i < schedule.length; i++) {
      var item = schedule[i];
      var card = document.createElement("div");
      var isActive = (i === todayIndex);
      
      card.className = "day-card" + (isActive ? " active" : "");
      card.innerHTML = '<div class="day-name">' + item.day + '</div>' +
                       '<div class="day-deity">' + item.deity + '</div>';
      gridEl.appendChild(card);
    }

    // Screen Wake Lock API Integration (with ES5 browser safety checks)
    if ('wakeLock' in navigator && navigator.wakeLock.request) {
      navigator.wakeLock.request('screen').catch(function(err) {
        console.log("Wake Lock Error: " + err.message);
      });
    }
  </script>
</body>
</html>
