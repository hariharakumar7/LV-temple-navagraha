<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="60">
  <title>Daily Navagraha Devotion</title>
  <style>
    :root {
      --saffron: #FF9933;
      --deep-saffron: #E67E22;
      --gold: #FFD700;
      --maroon: #4A0000;
      --bg-dark: #120000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, var(--maroon) 0%, var(--bg-dark) 100%);
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 1.5vw;
    }

    .app-viewport {
      width: 100%;
      height: 100%;
      max-width: 1920px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 1.5vh;
    }

    .banner {
      background: linear-gradient(90deg, transparent, var(--saffron), transparent);
      color: #000000;
      width: 100%;
      padding: 1vh 0;
      font-size: clamp(20px, 2.2vw, 36px);
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      text-align: center;
      flex-shrink: 0;
    }

    .mantra-container {
      /* Solid maroon fallback prevents TV engines from collapsing transparent alpha layers to black */
      background-color: #1a0303;
      background: rgba(35, 5, 5, 0.65);
      border: 2px solid var(--gold);
      border-radius: 16px;
      padding: 1.5vh 2vw;
      width: 100%;
      flex: 1;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
      position: relative;
    }

    .section-title {
      font-size: clamp(18px, 2vw, 32px);
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 800;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
      text-align: center;
      margin-bottom: 1vh;
      flex-shrink: 0;
    }

    .mantra-wrapper {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .mantra-text {
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.35;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.9);
      white-space: pre-line;
      text-align: center;
      width: auto;
      max-width: 100%;
      display: inline-block;
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1vw;
      width: 100%;
      padding-top: 1vh;
      border-top: 2px dashed var(--saffron);
      flex-shrink: 0;
    }

    .day-card {
      background-color: #120101;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 8px;
      padding: 1.2vh 0.5vw;
      text-align: center;
    }

    .day-card.active {
      background: linear-gradient(135deg, var(--saffron), var(--deep-saffron));
      color: #000000;
      border: 2px solid var(--gold);
      transform: scale(1.02);
      box-shadow: 0 0 15px rgba(255, 153, 51, 0.6);
    }

    .day-name {
      font-size: clamp(12px, 1.1vw, 18px);
      font-weight: 800;
      text-transform: uppercase;
    }

    .day-deity {
      font-size: clamp(13px, 1.2vw, 20px);
      font-weight: 600;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <div class="banner" id="today-banner">Today Graha Devata is ...</div>

    <!-- Today's Graham Card (Top) -->
    <div class="mantra-container">
      <div class="section-title" id="graham-title">Stotram ...</div>
      <div class="mantra-wrapper">
        <p class="mantra-text" id="graham-mantra">...</p>
      </div>
    </div>

    <!-- Navagraha Dhyana Shlokam Card (Bottom) -->
    <div class="mantra-container">
      <div class="section-title">Navagraha Dhyana Shlokam</div>
      <div class="mantra-wrapper">
        <p class="mantra-text">Ādityāya cha sōmāya maṅgaḻāya budhāya cha |
Guru śukra śanibhyaścha rāhavē kētavē namaḥ ||</p>
      </div>
    </div>

    <!-- 7-Day Grid -->
    <section class="week-grid" id="week-grid"></section>
  </div>

  <script>
    const schedule = [
      { day: "Sunday", deity: "Surya", mantra: "japākusuma saṅkāśaṃ kāśyapēyaṃ mahādyutim । \ntamōriṃ sarva pāpaghnaṃ praṇatōsmi divākaram ॥" },
      { day: "Monday", deity: "Chandra", mantra: "dadhiśaṅkha tuṣārābhaṃ kṣīrārṇava samudbhavam (kṣīrōdārṇava sambhavam) । \nnamāmi śaśinaṃ sōmaṃ śambhō-rmakuṭa bhūṣaṇam ॥" },
      { day: "Tuesday", deity: "Kujah / Mangala", mantra: "dharaṇī garbha sambhūtaṃ vidyutkānti samaprabham । \n kumāraṃ śaktihastaṃ taṃ kujaṃ [maṅgaḻaṃ] praṇamāmyaham ॥" },
      { day: "Wednesday", deity: "Budha", mantra: "priyaṅgu kalikāśyāmaṃ rūpēṇā pratimaṃ budham । \nsaumyaṃ saumya (satva) guṇōpētaṃ taṃ budhaṃ praṇamāmyaham ॥" },
      { day: "Thursday", deity: "Guru / Brihaspati", mantra: "dēvānāṃ cha ṛṣīṇāṃ cha guruṃ kāñchanasannibham । \nbuddhimantaṃ trilōkēśaṃ taṃ namāmi bṛhaspatim ॥" },
      { day: "Friday", deity: "Shukra", mantra: "himakunda mṛṇāḻābhaṃ daityānaṃ paramaṃ gurum । \nsarvaśāstra pravaktāraṃ bhārgavaṃ praṇamāmyaham ॥" },
      { day: "Saturday", deity: "Shani", mantra: "nīlāñjana samābhāsaṃ raviputraṃ yamāgrajam । \nChāyā mārtāṇḍa sambhūtaṃ taṃ namāmi śanaiścharam ॥" }
    ];

    const todayIndex = new Date().getDay();
    const todayData = schedule[todayIndex];

    document.getElementById("today-banner").innerText = `Today's Graha Devata is ${todayData.deity.toUpperCase()}`;
    document.getElementById("graham-title").innerText = `${todayData.deity.toUpperCase()} STOTRAM`;
    document.getElementById("graham-mantra").innerText = todayData.mantra;

    const gridEl = document.getElementById("week-grid");
    schedule.forEach((item, idx) => {
      const card = document.createElement("div");
      const isActive = idx === todayIndex;
      card.className = `day-card ${isActive ? 'active' : ''}`;
      card.innerHTML = `
        <div class="day-name">${item.day}</div>
        <div class="day-deity">${item.deity}</div>
      `;
      gridEl.appendChild(card);
    });

    // Binary search font autoscaler
    function maximizeMantraFont(textEl) {
      const wrapper = textEl.parentElement;
      let min = 12;
      let max = 140;
      let optimal = min;

      while (min <= max) {
        const mid = Math.floor((min + max) / 2);
        textEl.style.fontSize = mid + "px";

        if (textEl.offsetHeight <= wrapper.clientHeight && textEl.offsetWidth <= wrapper.clientWidth) {
          optimal = mid;
          min = mid + 1;
        } else {
          max = mid - 1;
        }
      }

      textEl.style.fontSize = optimal + "px";
    }

    function fitAllText() {
      document.querySelectorAll(".mantra-text").forEach(maximizeMantraFont);
    }

    window.addEventListener("load", fitAllText);
    window.addEventListener("resize", fitAllText);

    if (document.fonts) {
      document.fonts.ready.then(fitAllText);
    }
  </script>
</body>
</html>
