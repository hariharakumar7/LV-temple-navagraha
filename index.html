<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Navagraha Devotion</title>
  <style>
    :root {
      --saffron: #FF9933;
      --deep-saffron: #E67E22;
      --gold: #FFD700;
      --maroon: #4A0000;
      --bg-dark: #120000;
      --card-bg: rgba(255, 255, 255, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, var(--maroon) 0%, var(--bg-dark) 100%);
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1vw 2vw 2.5vw 2vw; /* Reduced top padding from 3vw to 1vw */
      text-align: center;
      overflow: hidden;
    }

    /* Main Section */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2vh; /* Reduced gap from 2vh */
    }

    .banner {
      background: linear-gradient(90deg, transparent, var(--saffron), transparent);
      color: #000000;
      width: 100%;
      padding: 0.8vh 0; /* Reduced vertical padding */
      font-size: 2.2vw;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .deity-title {
      font-size: 5.2vw;
      color: var(--gold);
      font-weight: 800;
      letter-spacing: 1px;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.4), 2px 2px 4px #000;
      margin-top: 0.5vh; /* Dialed down top margin */
    }

    .mantra-container {
      background: var(--card-bg);
      border: 2px solid var(--gold);
      border-radius: 16px;
      padding: 2.5vh 4vw; /* Reduced vertical padding from 4vh */
      max-width: 85%;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      margin: 1vh 0; /* Reduced margin from 2vh */
    }

    .mantra-label {
      font-size: 1.4vw;
      color: var(--saffron);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 1vh;
      font-weight: 700;
    }

    .mantra-text {
      font-size: 3.5vw;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.3;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
    }

    /* 7-Day Grid Layout */
    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1vw;
      margin-top: 1vh;
      margin-bottom: 2vh;
      padding: 0 1vw;
    }

    .day-card {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 8px;
      padding: 1.2vh 0.5vw;
      transition: all 0.3s ease;
    }

    .day-card.active {
      background: linear-gradient(135deg, var(--saffron), var(--deep-saffron));
      color: #000000;
      border: 2px solid var(--gold);
      transform: scale(1.06);
      box-shadow: 0 0 15px rgba(255, 153, 51, 0.6);
    }

    .day-name {
      font-size: 1.2vw;
      font-weight: 800;
      text-transform: uppercase;
    }

    .day-deity {
      font-size: 1.3vw;
      font-weight: 600;
      margin-top: 4px;
    }

    /* Universal Footer Chant */
    .footer-chant-box {
      border-top: 2px dashed var(--saffron);
      padding-top: 1.5vh;
      padding-bottom: 1vh; /* Adds bottom breathing room above display edge */
      width: 100%;
    }

    .footer-chant-title {
      font-size: 1.2vw;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 0.8vh;
      font-weight: 700;
    }

    .footer-chant-text {
      font-size: 2vw;
      font-weight: 600;
      color: #FFF;
      line-height: 1.4;
      letter-spacing: 0.5px;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>

  <!-- Main View for Today -->
  <main class="main-content">
    <div class="banner" id="today-banner">TODAY IS ...</div>
    <h1 class="deity-title" id="deity-name">...</h1>
    
    <div class="mantra-container">
      <div class="mantra-label">Daily Mantra</div>
      <p class="mantra-text" id="mantra-text">...</p>
    </div>
  </main>

  <!-- 7-Day Schedule Grid -->
  <section class="week-grid" id="week-grid"></section>

  <!-- Universal Daily Chant Footer -->
  <footer class="footer-chant-box">
    <div class="footer-chant-title">Daily chant including all 9 navagraha chants</div>
    <p class="footer-chant-text">
      Ādityāya cha sōmāya maṅgaḻāya budhāya cha |<br>
      Guru śukra śanibhyaścha rāhavē kētavē namaḥ ||
    </p>
  </footer>

  <script>
    const schedule = [
      { day: "Sunday", deity: "Surya", mantra: "Om Hraam Hreem Hroum Sah Suryaya Namah" },
      { day: "Monday", deity: "Chandra", mantra: "Om Shraam Shreem Shraum Sah Chandraye Namah" },
      { day: "Tuesday", deity: "Mangal", mantra: "Om Kraam Kreem Kraum Sah Bhaumay Namah" },
      { day: "Wednesday", deity: "Budha", mantra: "Om Braam Breem Braum Sah Budhay Namah" },
      { day: "Thursday", deity: "Guru / Brihaspati", mantra: "Om Graam Greem Graum Sah Gurave Namah" },
      { day: "Friday", deity: "Shukra", mantra: "Om Draam Dreem Draum Sah Shukray Namah" },
      { day: "Saturday", deity: "Shani", mantra: "Om Praam Preem Praum Sah Shanicharay Namah" }
    ];

    // Determine current day (0 = Sunday, 1 = Monday, etc.)
    const todayIndex = new Date().getDay();
    const todayData = schedule[todayIndex];

    // Populate Today's Hero Section
    document.getElementById("today-banner").innerText = `TODAY IS ${todayData.day.toUpperCase()}`;
    document.getElementById("deity-name").innerText = todayData.deity;
    document.getElementById("mantra-text").innerText = `"${todayData.mantra}"`;

    // Populate 7-Day Grid
    const gridEl = document.getElementById("week-grid");
    schedule.forEach((item, idx) => {
      const card = document.createElement("div");
      const isActive = idx === todayIndex;
      
      card.className = `day-card ${isActive ? 'active' : ''}`;
      card.innerHTML = `
        <div class="day-name">${item.day}</div>
        <div class="day-deity">${item.deity}</div>
      `;
      gridEl.appendChild(card);
    });
  </script>
</body>
</html>
