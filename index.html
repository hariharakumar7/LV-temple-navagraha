<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Navagraha Devotion</title>
  <style>
    :root {
      --saffron: #FF9933;
      --deep-saffron: #E67E22;
      --gold: #FFD700;
      --maroon: #4A0000;
      --bg-dark: #120000;
      --card-bg: rgba(255, 255, 255, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, var(--maroon) 0%, var(--bg-dark) 100%);
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 2vw;
    }

    .app-viewport {
      width: 100%;
      max-width: 1800px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5vh;
    }

    .banner {
      background: linear-gradient(90deg, transparent, var(--saffron), transparent);
      color: #000000;
      width: 100%;
      padding: 1.2vh 0;
      font-size: 2.4vw;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .mantra-container {
      background: var(--card-bg);
      border: 2px solid var(--gold);
      border-radius: 16px;
      padding: 2.5vh 3vw;
      width: 100%;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5vh;
      container-type: inline-size;
    }

    .section-title {
      font-size: clamp(20px, 2.5cqi, 40px);
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 800;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
      text-align: center;
    }

    .mantra-text {
      font-size: clamp(24px, 3.4cqi, 58px);
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.4;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
      white-space: pre-line;
      text-align: center;
      width: 100%;
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1vw;
      width: 100%;
      padding-top: 1.5vh;
      border-top: 2px dashed var(--saffron);
    }

    .day-card {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 8px;
      padding: 1.5vh 0.5vw;
      text-align: center;
      transition: all 0.3s ease;
    }

    .day-card.active {
      background: linear-gradient(135deg, var(--saffron), var(--deep-saffron));
      color: #000000;
      border: 2px solid var(--gold);
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(255, 153, 51, 0.6);
    }

    .day-name {
      font-size: clamp(12px, 1.2vw, 20px);
      font-weight: 800;
      text-transform: uppercase;
    }

    .day-deity {
      font-size: clamp(13px, 1.3vw, 22px);
      font-weight: 600;
      margin-top: 4px;
    }

    /* Invisible canvas element to trigger active rendering frames */
    #keep-alive-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 2px;
      height: 2px;
      opacity: 0.01;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <canvas id="keep-alive-canvas"></canvas>

  <div class="app-viewport">
    <div class="banner" id="today-banner">TODAY IS ...</div>

    <div class="mantra-container">
      <div class="section-title">Dhyana Shlokam</div>
      <p class="mantra-text">Ādityāya cha sōmāya maṅgaḻāya budhāya cha |
Guru śukra śanibhyaścha rāhavē kētavē namaḥ ||</p>
    </div>

    <div class="mantra-container">
      <div class="section-title" id="graham-title">Today's Graham - ...</div>
      <p class="mantra-text" id="graham-mantra">...</p>
    </div>

    <section class="week-grid" id="week-grid"></section>
  </div>

  <script>
    const schedule = [
      { day: "Sunday", deity: "Surya", mantra: "japākusuma saṅkāśaṃ kāśyapēyaṃ mahādyutim । \ntamōriṃ sarva pāpaghnaṃ praṇatōsmi divākaram ॥" },
      { day: "Monday", deity: "Chandra", mantra: "dadhiśaṅkha tuṣārābhaṃ kṣīrārṇava samudbhavam (kṣīrōdārṇava sambhavam) । \nnamāmi śaśinaṃ sōmaṃ śambhō-rmakuṭa bhūṣaṇam ॥" },
      { day: "Tuesday", deity: "Kujah / Mangala", mantra: "dharaṇī garbha sambhūtaṃ vidyutkānti samaprabham । \n kumāraṃ śaktihastaṃ taṃ kujaṃ [maṅgaḻaṃ] praṇamāmyaham ॥" },
      { day: "Wednesday", deity: "Budha", mantra: "priyaṅgu kalikāśyāmaṃ rūpēṇā pratimaṃ budham । \nsaumyaṃ saumya (satva) guṇōpētaṃ taṃ budhaṃ praṇamāmyaham ॥" },
      { day: "Thursday", deity: "Guru / Brihaspati", mantra: "dēvānāṃ cha ṛṣīṇāṃ cha guruṃ kāñchanasannibham । \nbuddhimantaṃ trilōkēśaṃ taṃ namāmi bṛhaspatim ॥" },
      { day: "Friday", deity: "Shukra", mantra: "himakunda mṛṇāḻābhaṃ daityānaṃ paramaṃ gurum । \nsarvaśāstra pravaktāraṃ bhārgavaṃ praṇamāmyaham ॥" },
      { day: "Saturday", deity: "Shani", mantra: "nīlāñjana samābhāsaṃ raviputraṃ yamāgrajam । \nChāyā mārtāṇḍa sambhūtaṃ taṃ namāmi śanaiścharam ॥" }
    ];

    const todayIndex = new Date().getDay();
    const todayData = schedule[todayIndex];

    document.getElementById("today-banner").innerText = `TODAY IS ${todayData.day.toUpperCase()}`;
    document.getElementById("graham-title").innerText = `Today's Graham - ${todayData.deity}`;
    document.getElementById("graham-mantra").innerText = todayData.mantra;

    const gridEl = document.getElementById("week-grid");
    schedule.forEach((item, idx) => {
      const card = document.createElement("div");
      const isActive = idx === todayIndex;
      card.className = `day-card ${isActive ? 'active' : ''}`;
      card.innerHTML = `
        <div class="day-name">${item.day}</div>
        <div class="day-deity">${item.deity}</div>
      `;
      gridEl.appendChild(card);
    });

    // Active Canvas Rendering Loop to simulate continuous web activity
    const canvas = document.getElementById('keep-alive-canvas');
    const ctx = canvas.getContext('2d');
    function keepAliveLoop() {
      ctx.fillStyle = ctx.fillStyle === '#ffffff' ? '#000000' : '#ffffff';
      ctx.fillRect(0, 0, 2, 2);
      requestAnimationFrame(keepAliveLoop);
    }
    keepAliveLoop();

    // Screen Wake Lock API
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log(`Wake Lock Error: ${err.message}`);
      }
    }
    requestWakeLock();
    document.addEventListener('visibilitychange', () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        requestWakeLock();
      }
    });
  </script>
</body>
</html>
