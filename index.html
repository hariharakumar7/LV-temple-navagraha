<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Navagraha Devotion</title>
  <style>
    :root {
      --saffron: #FF9933;
      --deep-saffron: #E67E22;
      --gold: #FFD700;
      --maroon: #4A0000;
      --bg-dark: #120000;
      --card-bg: rgba(255, 255, 255, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, var(--maroon) 0%, var(--bg-dark) 100%);
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2vh 2vw 2vh 2vw; /* Tight, consistent margins */
      text-align: center;
      overflow: hidden;
    }

    /* Main Section Container */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3vh; /* Controlled spacing between the two main mantra blocks */
    }

    /* Banner for Day of Week */
    .banner {
      background: linear-gradient(90deg, transparent, var(--saffron), transparent);
      color: #000000;
      width: 100%;
      padding: 0.8vh 0;
      font-size: 2.2vw;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      margin-bottom: 1vh;
    }

    /* Standardized Card Container for both Shloka and Graham sections */
    .mantra-container {
      background: var(--card-bg);
      border: 2px solid var(--gold);
      border-radius: 16px;
      padding: 3vh 4vw;
      width: 90%;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      gap: 1.5vh;
    }

    /* Standardized Header inside the cards */
    .section-title {
      font-size: 2vw; /* Consistent size for "Dhyana Shlokam" and "Today's Graham..." */
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 800;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
    }

    /* Standardized Mantra Text inside the cards */
    .mantra-text {
      font-size: 3vw; /* Consistent size for both chants */
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.4;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
      white-space: pre-line; /* Honors the \n characters in your string array */
    }

    /* 7-Day Grid Layout at Bottom */
    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1vw;
      padding: 1.5vh 1vw;
      border-top: 2px dashed var(--saffron);
    }

    .day-card {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 8px;
      padding: 1.2vh 0.5vw;
      transition: all 0.3s ease;
    }

    .day-card.active {
      background: linear-gradient(135deg, var(--saffron), var(--deep-saffron));
      color: #000000;
      border: 2px solid var(--gold);
      transform: scale(1.06);
      box-shadow: 0 0 15px rgba(255, 153, 51, 0.6);
    }

    .day-name {
      font-size: 1.2vw;
      font-weight: 800;
      text-transform: uppercase;
    }

    .day-deity {
      font-size: 1.3vw;
      font-weight: 600;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- Top Banner -->
  <div class="banner" id="today-banner">TODAY IS ...</div>

  <!-- Main View containing the two blocks -->
  <main class="main-content">
    
    <!-- Dhyana Shlokam Block (Universal Chant) -->
    <div class="mantra-container">
      <div class="section-title">Dhyana Shlokam</div>
      <p class="mantra-text">Ādityāya cha sōmāya maṅgaḻāya budhāya cha |
Guru śukra śanibhyaścha rāhavē kētavē namaḥ ||</p>
    </div>

    <!-- Today's Graham Block (Dynamic Chant) -->
    <div class="mantra-container">
      <div class="section-title" id="graham-title">Today's Graham - ...</div>
      <p class="mantra-text" id="graham-mantra">...</p>
    </div>

  </main>

  <!-- 7-Day Schedule Grid -->
  <section class="week-grid" id="week-grid"></section>

  <script>
    const schedule = [
      { day: "Sunday", deity: "Surya", mantra: "japākusuma saṅkāśaṃ kāśyapēyaṃ mahādyutim । \ntamōriṃ sarva pāpaghnaṃ praṇatōsmi divākaram ॥" },
      { day: "Monday", deity: "Chandra", mantra: "dadhiśaṅkha tuṣārābhaṃ kṣīrārṇava samudbhavam (kṣīrōdārṇava sambhavam) । \nnamāmi śaśinaṃ sōmaṃ śambhō-rmakuṭa bhūṣaṇam ॥" },
      { day: "Tuesday", deity: "Kujah / Mangala", mantra: "dharaṇī garbha sambhūtaṃ vidyutkānti samaprabham । \n kumāraṃ śaktihastaṃ taṃ kujaṃ [maṅgaḻaṃ] praṇamāmyaham ॥" },
      { day: "Wednesday", deity: "Budha", mantra: "priyaṅgu kalikāśyāmaṃ rūpēṇā pratimaṃ budham । \nsaumyaṃ saumya (satva) guṇōpētaṃ taṃ budhaṃ praṇamāmyaham ॥" },
      { day: "Thursday", deity: "Guru / Brihaspati", mantra: "dēvānāṃ cha ṛṣīṇāṃ cha guruṃ kāñchanasannibham । \nbuddhimantaṃ trilōkēśaṃ taṃ namāmi bṛhaspatim ॥" },
      { day: "Friday", deity: "Shukra", mantra: "himakunda mṛṇāḻābhaṃ daityānaṃ paramaṃ gurum । \nsarvaśāstra pravaktāraṃ bhārgavaṃ praṇamāmyaham ॥" },
      { day: "Saturday", deity: "Shani", mantra: "nīlāñjana samābhāsaṃ raviputraṃ yamāgrajam । \nChāyā mārtāṇḍa sambhūtaṃ taṃ namāmi śanaiścharam ॥" }
    ];

    // Determine current day (0 = Sunday, 1 = Monday, etc.)
    const todayIndex = new Date().getDay();
    const todayData = schedule[todayIndex];

    // Populate Top Banner
    document.getElementById("today-banner").innerText = `TODAY IS ${todayData.day.toUpperCase()}`;

    // Populate Dynamic Graham Block
    document.getElementById("graham-title").innerText = `Today's Graham - ${todayData.deity}`;
    document.getElementById("graham-mantra").innerText = todayData.mantra;

    // Populate 7-Day Grid
    const gridEl = document.getElementById("week-grid");
    schedule.forEach((item, idx) => {
      const card = document.createElement("div");
      const isActive = idx === todayIndex;
      
      card.className = `day-card ${isActive ? 'active' : ''}`;
      card.innerHTML = `
        <div class="day-name">${item.day}</div>
        <div class="day-deity">${item.deity}</div>
      `;
      gridEl.appendChild(card);
    });
  </script>
</body>
</html>
